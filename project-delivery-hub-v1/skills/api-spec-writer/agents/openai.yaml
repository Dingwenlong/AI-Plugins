interface:
  display_name: "02 API 规格写入器"
  short_description: "把功能 handoff 转成 API Spec JSON，并回写 spec 状态。"
  default_prompt: "使用 $api-spec-writer 执行第 02 步 02 API 规格写入器：直接运行脚本来初始化或恢复集中 `.agent/context` 下的共享 execution。脚本应先读取 `execution-batch.json` 和同目录 execution 状态面，只更新共享 `execution-state.json`、`api-checklist.json`、`manifest.json` 的 `spec*` 字段，并在 `.agent/context/<functionCode>/apis/<apiId>/` 写出 `{functionCode}_API_Spec.json`。启动时优先读取 `.agent/functions/<functionCode>/handoff/development-handoff.json` 与 inputs；若 handoff 不存在，应先回到 `专案需求接口设计梳理` 物化开发输入包，不把第 01 步当作补救入口。若只是缺少全局外部参考索引，才使用第 01 步 [$reference-index-importer](C:/Users/<username>/plugins/project-delivery-hub-v1/skills/reference-index-importer/SKILL.md)。专案规则必须优先从 `<rulesRoot>/catalog.json` 读取，缺少规则库时写入 unresolved，不从插件内旧专案 reference 偷读默认规则。`functionCode` 必须保留 TSD 文件名中的完整功能编号，例如 `D.006`、`N.001.001`，不能裁切成上层编号。除保留原有 `businessLogic` 外，新的 API_Spec 还必须包含 machine-readable `codeHandoff`，把 `logicFlow`、`queryContracts`、`mappingRules`、`dependencyHints`、`legacyEvidence`、`constraints`、`unresolved` 明确交给第 04 步 [$api-code-writer](C:/Users/<username>/plugins/project-delivery-hub-v1/skills/api-code-writer/SKILL.md)。"
