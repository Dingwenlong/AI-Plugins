<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Project Delivery Hub Main Flow</title>
  <desc id="desc">Design Leader coordinates feedback/new-demand fixes, Office edit plans, code writing, and read-only code style review before the 01-05 multi-API delivery flow.</desc>
  <style>
    .bg{fill:#f8fafc}.lane{fill:#ffffff;stroke:#cbd5e1;stroke-width:2}.box{rx:8;fill:#eef6ff;stroke:#2563eb;stroke-width:2}.gate{rx:8;fill:#fff7ed;stroke:#f97316;stroke-width:2}.state{rx:8;fill:#ecfdf5;stroke:#16a34a;stroke-width:2}.warn{rx:8;fill:#fefce8;stroke:#ca8a04;stroke-width:2}.end{rx:8;fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.title{font:700 26px Arial,sans-serif;fill:#0f172a}.label{font:700 17px Arial,sans-serif;fill:#0f172a}.small{font:13px Arial,sans-serif;fill:#334155}.arrow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker></defs>
  <rect class="bg" width="1280" height="760"/>
  <text class="title" x="48" y="56">project-delivery-hub-v1: design, Office, and delivery leader flow</text>

  <rect class="lane" x="40" y="92" width="1200" height="170" rx="12"/>
  <text class="label" x="64" y="124">Design Leader, feedback fixes, and Office edits</text>
  <rect class="gate" x="64" y="148" width="210" height="72"/><text class="label" x="84" y="178">Feedback entry</text><text class="small" x="84" y="200">issue list, email, new demand</text>
  <rect class="box" x="334" y="148" width="230" height="72"/><text class="label" x="354" y="178">Design Leader</text><text class="small" x="354" y="200">contract, naming, sources</text>
  <rect class="state" x="624" y="148" width="250" height="72"/><text class="label" x="644" y="178">design + office plans</text><text class="small" x="644" y="200">file claims, office-edit-plan</text>
  <rect class="warn" x="934" y="148" width="250" height="72"/><text class="label" x="954" y="178">development-handoff</text><text class="small" x="954" y="200">leader writes hashes</text>
  <path class="arrow" d="M274 184H334"/><path class="arrow" d="M564 184H624"/><path class="arrow" d="M874 184H934"/>

  <rect class="lane" x="40" y="296" width="1200" height="190" rx="12"/>
  <text class="label" x="64" y="328">01-04 implementation orchestration and style review</text>
  <rect class="box" x="64" y="356" width="170" height="72"/><text class="label" x="84" y="386">01 reference</text><text class="small" x="84" y="408">optional global index</text>
  <rect class="box" x="274" y="356" width="170" height="72"/><text class="label" x="294" y="386">02 spec</text><text class="small" x="294" y="406">TSD/API Detail</text><text class="small" x="294" y="422">+ sequence evidence</text>
  <rect class="box" x="484" y="356" width="170" height="72"/><text class="label" x="504" y="386">03 fixture</text><text class="small" x="504" y="408">done, skipped, blocked</text>
  <rect class="gate" x="694" y="356" width="210" height="72"/><text class="label" x="714" y="386">04 code + style</text><text class="small" x="714" y="408">change-plan + drift report</text>
  <rect class="state" x="944" y="338" width="230" height="108"/><text class="label" x="964" y="368">orchestration plan</text><text class="small" x="964" y="392">api-workgroups.json</text><text class="small" x="964" y="414">file-claims.json</text>
  <path class="arrow" d="M234 392H274"/><path class="arrow" d="M444 392H484"/><path class="arrow" d="M654 392H694"/><path class="arrow" d="M904 392H944"/>

  <rect class="lane" x="40" y="520" width="1200" height="170" rx="12"/>
  <text class="label" x="64" y="552">Workers, testing, final assessment</text>
  <rect class="box" x="64" y="580" width="240" height="72"/><text class="label" x="84" y="610">Parallel workers</text><text class="small" x="84" y="632">claimed code or Office files</text>
  <rect class="gate" x="344" y="580" width="240" height="72"/><text class="label" x="364" y="610">Leader apply and verify</text><text class="small" x="364" y="632">serial shared state writes</text>
  <rect class="box" x="624" y="580" width="220" height="72"/><text class="label" x="644" y="610">05 UT and report</text><text class="small" x="644" y="632">test file claims, DOCX</text>
  <rect class="end" x="884" y="580" width="280" height="72"/><text class="label" x="904" y="610">final-assessment.json</text><text class="small" x="904" y="632">only pass when gates pass</text>
  <path class="arrow" d="M304 616H344"/><path class="arrow" d="M584 616H624"/><path class="arrow" d="M844 616H884"/>
</svg>
