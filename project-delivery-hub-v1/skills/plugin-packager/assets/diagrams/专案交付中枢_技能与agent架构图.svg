<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Skills and Agent Architecture</title>
  <desc id="desc">Design Leader, Office editor, code style reviewer, and multi-API leader coordinate delivery skills and worker agents without shared state conflicts.</desc>
  <style>
    .bg{fill:#f8fafc}.hub{rx:12;fill:#0f766e;stroke:#134e4a;stroke-width:2}.skill{rx:8;fill:#eef6ff;stroke:#2563eb;stroke-width:2}.agent{rx:8;fill:#ecfdf5;stroke:#16a34a;stroke-width:2}.state{rx:8;fill:#fff7ed;stroke:#f97316;stroke-width:2}.report{rx:8;fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.title{font:700 26px Arial,sans-serif;fill:#0f172a}.label{font:700 16px Arial,sans-serif;fill:#0f172a}.hubText{font:700 20px Arial,sans-serif;fill:white}.small{font:13px Arial,sans-serif;fill:#334155}.whiteSmall{font:13px Arial,sans-serif;fill:white}.line{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:6 5;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker></defs>
  <rect class="bg" width="1280" height="760"/>
  <text class="title" x="48" y="56">Skills and agent architecture</text>

  <rect class="hub" x="470" y="92" width="340" height="118"/>
  <text class="hubText" x="512" y="138">Design + Office + multi-api leaders</text>
  <text class="whiteSmall" x="512" y="164">current conversation commands agents</text>
  <text class="whiteSmall" x="512" y="188">shared state is leader-only</text>

  <rect class="skill" x="70" y="270" width="200" height="78"/><text class="label" x="90" y="302">Design sync</text><text class="small" x="90" y="324">leader, feedback, edit plans</text>
  <rect class="skill" x="310" y="270" width="200" height="78"/><text class="label" x="330" y="302">02 spec writer</text><text class="small" x="330" y="322">TSD/API + sequence</text><text class="small" x="330" y="340">evidence input</text>
  <rect class="skill" x="550" y="270" width="200" height="78"/><text class="label" x="570" y="302">03 SQL fixture</text><text class="small" x="570" y="324">leader serial</text>
  <rect class="skill" x="790" y="270" width="200" height="78"/><text class="label" x="810" y="302">04 code + style</text><text class="small" x="810" y="324">write, locate drift</text>
  <rect class="skill" x="1030" y="270" width="200" height="78"/><text class="label" x="1050" y="302">05 UT report</text><text class="small" x="1050" y="324">tests and DOCX</text>

  <path class="line" d="M520 210L170 270"/><path class="line" d="M590 210L410 270"/><path class="line" d="M640 210L650 270"/><path class="line" d="M700 210L890 270"/><path class="line" d="M760 210L1130 270"/>

  <rect class="agent" x="80" y="452" width="240" height="92"/><text class="label" x="104" y="484">Feedback coordinator</text><text class="small" x="104" y="508">issues to design plan</text><text class="small" x="104" y="530">uses design sync rules</text>
  <rect class="agent" x="390" y="452" width="240" height="92"/><text class="label" x="414" y="484">Office editor workers</text><text class="small" x="414" y="508">TSD Word, API Excel</text><text class="small" x="414" y="530">claimed files only</text>
  <rect class="agent" x="700" y="452" width="240" height="92"/><text class="label" x="724" y="484">Code/style workers</text><text class="small" x="724" y="508">02-05 workgroups</text><text class="small" x="724" y="530">claimed or read-only</text>
  <rect class="state" x="1010" y="452" width="220" height="92"/><text class="label" x="1034" y="484">Leader state writer</text><text class="small" x="1034" y="508">.agent/context only</text><text class="small" x="1034" y="530">single writer</text>

  <path class="dash" d="M510 210L200 452"/><path class="dash" d="M700 210L510 452"/><path class="dash" d="M740 210L820 452"/><path class="dash" d="M790 210L1120 452"/>

  <rect class="report" x="230" y="626" width="820" height="70"/>
  <text class="label" x="254" y="656">Final rule</text>
  <text class="small" x="354" y="656">workers return modifiedFiles and evidence; leader validates claims, writes reports, and decides final-assessment.json</text>
</svg>
