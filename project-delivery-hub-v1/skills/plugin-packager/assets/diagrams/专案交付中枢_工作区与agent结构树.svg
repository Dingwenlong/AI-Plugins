<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Workspace and Agent State Tree</title>
  <desc id="desc">Shared .agent structure with design-stage Office edit plans, 02-05 orchestration state, code style review reports, and claim-based worker boundaries.</desc>
  <style>
    .bg{fill:#f8fafc}.panel{rx:12;fill:#ffffff;stroke:#cbd5e1;stroke-width:2}.folder{rx:6;fill:#eef6ff;stroke:#2563eb;stroke-width:2}.state{rx:6;fill:#ecfdf5;stroke:#16a34a;stroke-width:2}.claim{rx:6;fill:#fff7ed;stroke:#f97316;stroke-width:2}.test{rx:6;fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.title{font:700 26px Arial,sans-serif;fill:#0f172a}.label{font:700 16px Arial,sans-serif;fill:#0f172a}.small{font:13px Consolas,monospace;fill:#334155}.line{stroke:#64748b;stroke-width:2;fill:none}
  </style>
  <rect class="bg" width="1280" height="760"/>
  <text class="title" x="48" y="56">Workspace and .agent structure for design, Office, and delivery leaders</text>

  <rect class="panel" x="52" y="92" width="360" height="600"/>
  <text class="label" x="78" y="126">&lt;workspaceRoot&gt;</text>
  <rect class="folder" x="78" y="154" width="280" height="54"/><text class="small" x="98" y="187">.agent/</text>
  <rect class="folder" x="78" y="228" width="280" height="54"/><text class="small" x="98" y="261">feature-branch-folder/</text>
  <rect class="folder" x="78" y="302" width="280" height="54"/><text class="small" x="98" y="335">solution and source code</text>
  <rect class="claim" x="78" y="580" width="280" height="62"/><text class="small" x="98" y="606">workers modify only claimed</text><text class="small" x="98" y="626">code/test files</text>

  <rect class="panel" x="460" y="92" width="360" height="600"/>
  <text class="label" x="486" y="126">.agent/ shared state</text>
  <rect class="folder" x="486" y="154" width="280" height="50"/><text class="small" x="506" y="185">config/chain-workspace.json</text>
  <rect class="folder" x="486" y="224" width="280" height="50"/><text class="small" x="506" y="255">project-rules/&lt;workspaceKey&gt;/</text>
  <rect class="folder" x="486" y="294" width="280" height="58"/><text class="small" x="506" y="320">functions/&lt;functionCode&gt;/handoff/</text><text class="small" x="506" y="340">analysis/sequence-diagrams/</text>
  <rect class="state" x="486" y="364" width="280" height="50"/><text class="small" x="506" y="395">context/&lt;functionCode&gt;/</text>
  <rect class="folder" x="514" y="434" width="252" height="50"/><text class="small" x="534" y="465">apis/&lt;apiId&gt;/change-plan.json</text>
  <rect class="state" x="514" y="494" width="252" height="50"/><text class="small" x="534" y="525">code-style-review.json/md</text>
  <rect class="folder" x="514" y="554" width="252" height="50"/><text class="small" x="534" y="585">apis/&lt;apiId&gt;/*_API_Spec.json</text>
  <rect class="test" x="514" y="624" width="252" height="50"/><text class="small" x="534" y="655">UT report manifest/results</text>

  <rect class="panel" x="868" y="92" width="360" height="600"/>
  <text class="label" x="894" y="126">orchestration/</text>
  <rect class="claim" x="894" y="154" width="280" height="58"/><text class="small" x="914" y="180">functions/.../design-change-plan</text><text class="small" x="914" y="198">design fixes and file claims</text>
  <rect class="claim" x="894" y="232" width="280" height="58"/><text class="small" x="914" y="258">functions/.../office-edit-plan</text><text class="small" x="914" y="276">Word/Excel write contract</text>
  <rect class="claim" x="894" y="310" width="280" height="58"/><text class="small" x="914" y="336">context/.../api-workgroups</text><text class="small" x="914" y="354">02-05 conflict graph</text>
  <rect class="claim" x="894" y="388" width="280" height="58"/><text class="small" x="914" y="414">context/.../final-assessment</text><text class="small" x="914" y="432">02-05 gates and conclusion</text>
  <rect class="state" x="894" y="518" width="280" height="74"/><text class="small" x="914" y="546">leader writes shared state</text><text class="small" x="914" y="566">workers return evidence only</text>

  <path class="line" d="M358 181H486"/><path class="line" d="M766 389H894"/><path class="line" d="M766 459H894"/><path class="line" d="M766 649H894"/>
</svg>
