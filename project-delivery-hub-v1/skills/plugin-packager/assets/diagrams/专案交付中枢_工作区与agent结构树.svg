<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1240" viewBox="0 0 1460 1240" role="img" aria-labelledby="title desc">
  <title id="title">专案交付中枢：工作区、.agent 与分支代码结构树</title>
  <desc id="desc">展示 workspaceRoot、共享 .agent、各功能分支代码目录之间的层级关系，并标注目录来源技能与作用。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #d9e2ef; stroke-width: 1.2; rx: 18; }
      .title { font: 700 28px "Microsoft JhengHei", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 15px "Microsoft JhengHei", "Microsoft YaHei", Arial, sans-serif; fill: #64748b; }
      .tree { font: 16px Consolas, "Cascadia Mono", "Microsoft JhengHei", monospace; fill: #0f172a; }
      .tree-strong { font: 700 16px Consolas, "Cascadia Mono", "Microsoft JhengHei", monospace; fill: #0f172a; }
      .meta { font: 14px "Microsoft JhengHei", "Microsoft YaHei", Arial, sans-serif; fill: #475569; }
      .meta-muted { font: 13px "Microsoft JhengHei", "Microsoft YaHei", Arial, sans-serif; fill: #64748b; }
      .line { stroke: #94a3b8; stroke-width: 1.6; fill: none; stroke-linecap: square; }
      .line-soft { stroke: #cbd5e1; stroke-width: 1.3; fill: none; stroke-linecap: square; }
      .badge { font: 12px "Microsoft JhengHei", "Microsoft YaHei", Arial, sans-serif; fill: #334155; }
      .tag-agent { fill: #dcfce7; stroke: #22c55e; }
      .tag-config { fill: #dbeafe; stroke: #3b82f6; }
      .tag-design { fill: #ffedd5; stroke: #f97316; }
      .tag-ref { fill: #cffafe; stroke: #06b6d4; }
      .tag-rule { fill: #f5d0fe; stroke: #c026d3; }
      .tag-context { fill: #ede9fe; stroke: #8b5cf6; }
      .tag-status { fill: #fef3c7; stroke: #f59e0b; }
      .tag-code { fill: #e0e7ff; stroke: #6366f1; }
      .tag-legacy { fill: #f1f5f9; stroke: #94a3b8; stroke-dasharray: 5 4; }
      .folder-body { fill: #ffffff; stroke: #64748b; stroke-width: 1.2; rx: 3; }
      .folder-tab { fill: #e2e8f0; stroke: #64748b; stroke-width: 1.2; }
      .dot { fill: #334155; }
      .note-panel { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; rx: 10; }
    </style>
  </defs>

  <rect class="bg" width="1460" height="1240"/>
  <rect class="panel" x="34" y="32" width="1392" height="1176"/>

  <g transform="translate(72,72)">
    <circle cx="13" cy="13" r="11" fill="#37bd7a"/>
    <path d="M8 13.5l3.2 3.2L18.5 8.8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="title" x="36" y="22">工作区与 .agent 结构树</text>
    <text class="subtitle" x="36" y="50">.agent 是共享链路资料库；每支功能分支的 P240301Git 才是实际代码仓库 project-root。</text>
  </g>

  <g transform="translate(86,154)">
    <rect class="note-panel" x="0" y="0" width="1288" height="58"/>
    <text class="meta" x="22" y="25">示例工作区：</text>
    <text class="tree-strong" x="112" y="25">D:\Devs\<PROJECT></text>
    <text class="meta" x="22" y="47">通用写法：</text>
    <text class="tree" x="112" y="47">&lt;workspaceRoot&gt;\.agent</text>
    <text class="meta" x="362" y="47">与</text>
    <text class="tree" x="392" y="47">&lt;workspaceRoot&gt;\&lt;branchFolder&gt;\P240301Git</text>
  </g>

  <!-- Tree trunk -->
  <g transform="translate(86,252)">
    <path class="line" d="M28 28 V650"/>

    <!-- Root -->
    <g transform="translate(0,0)">
      <path class="line" d="M28 28 H62"/>
      <circle class="dot" cx="28" cy="28" r="3.5"/>
      <text class="tree-strong" x="74" y="34">&lt;workspaceRoot&gt;/</text>
      <rect class="tag-code" x="268" y="8" width="176" height="34" rx="8"/>
      <text class="badge" x="286" y="30">项目主工作区</text>
      <text class="meta" x="470" y="30">来源：local-workspaces.json；作用：承载共享资料库与多支功能分支</text>
    </g>

    <!-- Agent branch -->
    <g transform="translate(0,82)">
      <path class="line" d="M28 28 H62"/>
      <path class="line" d="M62 28 V470"/>
      <text class="tree-strong" x="74" y="34">├─ .agent/</text>
      <rect class="tag-agent" x="268" y="8" width="176" height="34" rx="8"/>
      <text class="badge" x="286" y="30">共享执行资料库</text>
      <text class="meta" x="470" y="30">来源：workspace resolver / plugin-packager；作用：集中保存规则、输入包、状态与图源</text>
    </g>

    <!-- Agent children -->
    <g transform="translate(0,150)">
      <path class="line-soft" d="M62 22 H96"/>
      <text class="tree" x="108" y="28">│  ├─ config/</text>
      <rect class="tag-config" x="268" y="0" width="176" height="34" rx="8"/>
      <text class="badge" x="286" y="22">工作区配置</text>
      <text class="meta" x="470" y="22">来源：workspace resolver + 需求梳理 + 智能表格同步；作用：chain-workspace、design-source-registry、wedoc-smartsheet-targets</text>
      <text class="meta-muted" x="470" y="48">wedoc-smartsheet-targets.json 为项目私有配置，导出插件时必须排除</text>
    </g>

    <g transform="translate(0,214)">
      <path class="line-soft" d="M62 22 H96"/>
      <text class="tree" x="108" y="28">│  ├─ functions/&lt;functionCode&gt;/</text>
      <rect class="tag-design" x="430" y="0" width="176" height="34" rx="8"/>
      <text class="badge" x="448" y="22">功能梳理产物</text>
      <text class="meta" x="632" y="22">来源：专案需求接口设计梳理；作用：analysis / inputs / handoff</text>
    </g>

    <g transform="translate(0,278)">
      <path class="line-soft" d="M62 22 H96"/>
      <text class="tree" x="108" y="28">│  ├─ reference/global/</text>
      <rect class="tag-ref" x="430" y="0" width="176" height="34" rx="8"/>
      <text class="badge" x="448" y="22">外部参考索引</text>
      <text class="meta" x="632" y="22">来源：01 参考资料索引导入器；作用：外部 API / DB Schema 共用索引</text>
    </g>

    <g transform="translate(0,342)">
      <path class="line-soft" d="M62 22 H96"/>
      <text class="tree" x="108" y="28">│  ├─ project-rules/&lt;workspaceKey&gt;/</text>
      <rect class="tag-rule" x="520" y="0" width="176" height="34" rx="8"/>
      <text class="badge" x="538" y="22">专案规则库</text>
      <text class="meta" x="722" y="22">来源：专案规则分析器；作用：catalog / rules / assets，供各技能读取</text>
    </g>

    <g transform="translate(0,406)">
      <path class="line-soft" d="M62 22 H96"/>
      <text class="tree" x="108" y="28">│  ├─ context/&lt;functionCode&gt;/</text>
      <rect class="tag-context" x="430" y="0" width="176" height="34" rx="8"/>
      <text class="badge" x="448" y="22">开发执行状态</text>
      <text class="meta" x="632" y="22">来源：02-05 开发链；作用：API Spec、fixture、change-plan、UT 上下文</text>
    </g>

    <g transform="translate(0,470)">
      <path class="line-soft" d="M62 22 H96"/>
      <text class="tree" x="108" y="28">│  ├─ status/</text>
      <rect class="tag-status" x="268" y="0" width="176" height="34" rx="8"/>
      <text class="badge" x="286" y="22">总控状态</text>
      <text class="meta" x="470" y="22">来源：链路总控；作用：chain-status 记录功能进度、分支绑定与阻塞原因</text>
    </g>

    <g transform="translate(0,534)">
      <path class="line-soft" d="M62 22 H96"/>
      <text class="tree" x="108" y="28">│  └─ wedoc-smartsheet-receipts/</text>
      <rect class="tag-config" x="268" y="0" width="176" height="34" rx="8"/>
      <text class="badge" x="286" y="22">智能表格回执</text>
      <text class="meta" x="470" y="22">来源：智能表格异动记录写入器；作用：记录 record_id、请求 payload 与响应 payload</text>
    </g>

    <!-- Branch code -->
    <g transform="translate(0,632)">
      <path class="line" d="M28 28 H62"/>
      <path class="line" d="M62 28 V150"/>
      <text class="tree-strong" x="74" y="34">├─ &lt;branchFolder&gt;/</text>
      <rect class="tag-code" x="294" y="8" width="176" height="34" rx="8"/>
      <text class="badge" x="312" y="30">功能分支文件夹</text>
      <text class="meta" x="496" y="30">来源：Git 分支；示例：feature_common / develop / D.007</text>
    </g>

    <g transform="translate(0,700)">
      <path class="line-soft" d="M62 22 H96"/>
      <text class="tree" x="108" y="28">│  └─ P240301Git/</text>
      <rect class="tag-code" x="294" y="0" width="176" height="34" rx="8"/>
      <text class="badge" x="312" y="22">实际代码仓库</text>
      <text class="meta" x="496" y="22">来源：project-root；作用：03/04/05 读取 solution、写代码与测试证据</text>
      <text class="meta-muted" x="496" y="48">示例：D:\Devs\<PROJECT>\feature_common\P240301Git</text>
    </g>

    <g transform="translate(0,768)">
      <path class="line-soft" d="M96 22 H130"/>
      <text class="tree" x="142" y="28">   └─ solution / source / tests</text>
      <rect class="tag-code" x="424" y="0" width="176" height="34" rx="8"/>
      <text class="badge" x="442" y="22">工程文件</text>
      <text class="meta" x="626" y="22">作用：Controller / Service / Entity / UnitTest 等实际源码</text>
    </g>

    <!-- Legacy -->
    <g transform="translate(0,856)">
      <path class="line" d="M28 28 H62"/>
      <text class="tree" x="74" y="34">└─ 旧版共享目录</text>
      <rect class="tag-legacy" x="268" y="8" width="176" height="34" rx="8"/>
      <text class="badge" x="286" y="30">已废弃</text>
      <text class="meta" x="470" y="30">作用：只作历史识别，不参与新版运行时与打包判断</text>
    </g>
  </g>

  <g transform="translate(86,1160)">
    <rect class="note-panel" x="0" y="0" width="1288" height="38"/>
    <text class="meta-muted" x="20" y="24">阅读顺序：先看 &lt;workspaceRoot&gt;，再看共享 .agent，最后看各功能分支的 P240301Git。目录右侧标注负责技能与用途。</text>
  </g>
</svg>
